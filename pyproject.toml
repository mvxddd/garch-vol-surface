[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurface"
version = "1.0.0"
description = "GARCH volatility forecasting and arbitrage-free implied volatility surface construction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "arch>=6.3",
    "statsmodels>=0.14",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
app = ["streamlit>=1.30"]

[project.scripts]
volsurface = "scripts.run_pipeline:main"

[tool.setuptools.packages.find]
include = ["volsurface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so a bare `pytest` works from a fresh clone
# without installing the package first. `python -m pytest` adds the working
# directory implicitly and `pytest` does not, so without this the two commands
# disagree — which is exactly how the README's own `pytest -q` instruction came
# to be broken while every local run passed.
pythonpath = ["."]
markers = ["slow: end-to-end runs (deselect with -m 'not slow')"]
filterwarnings = ["ignore::FutureWarning", "ignore::RuntimeWarning"]
